services:
  - type: web
    name: crypto-trading-agent
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: EXCHANGE_ID
        value: binance
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: LIVE_EXECUTION_ENABLED
        sync: false
      - key: EXCHANGE_API_KEY
        sync: false
      - key: EXCHANGE_SECRET
        sync: false
      - key: PAPER_CAPITAL_USDT
        sync: false
